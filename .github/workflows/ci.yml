name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fxbotmarket
          POSTGRES_PASSWORD: fxbotmarket
          POSTGRES_DB: fxbotmarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fxbotmarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://fxbotmarket:fxbotmarket@localhost:5432/fxbotmarket?schema=public"
      REDIS_URL: "redis://localhost:6379"
      AUTH_SECRET: "ci-test-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      EMAIL_PROVIDER: "console"
      PAYMENT_PROVIDER: "manual"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Phase 5 (docs/PHASE5_AUDIT.md): security-check step — fails the
      # build on a critical known-vulnerable dependency. Threshold is
      # "critical" rather than "high": as of this writing there's exactly
      # one high-severity advisory (deepmerge-ts, pulled in transitively by
      # the `prisma` CLI devDependency only — @prisma/client, the runtime
      # dependency, is unaffected) with no fix available that doesn't
      # downgrade Prisma against this project's own version pin (see
      # CLAUDE.md). It's a known, accepted, tracked risk (a dev-time CLI
      # tool, not shipped to production), not silently ignored — re-run
      # `npm audit` periodically and raise this threshold back to "high"
      # once a real fix lands upstream. Not a replacement for a real SAST/
      # secret-scanning tool (CodeQL, Snyk, etc.), which needs an
      # account/config this repo doesn't have set up yet; this is the
      # zero-setup baseline.
      - run: npm audit --audit-level=critical

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - run: npm run build
